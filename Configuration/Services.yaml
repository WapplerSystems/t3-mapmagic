services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\MapMagic\:
    resource: '../Classes/*'
    exclude: '../Classes/{Domain/Model}'

  WapplerSystems\MapMagic\Mvc\Configuration\ConfigurationManagerInterface:
    alias: WapplerSystems\MapMagic\Mvc\Configuration\ConfigurationManager
    public: true

  WapplerSystems\MapMagic\Mvc\Configuration\TypoScriptService:
    public: true

  WapplerSystems\MapMagic\Mvc\Persistence\FormPersistenceManagerInterface:
    alias: WapplerSystems\MapMagic\Mvc\Persistence\FormPersistenceManager
    public: true

  WapplerSystems\MapMagic\Service\TranslationService:
    public: true
    arguments:
      $runtimeCache: '@cache.runtime'

  WapplerSystems\MapMagic\Domain\Factory\ArrayFormFactory:
    public: true
    shared: false

  WapplerSystems\MapMagic\Domain\Renderer\FluidFormRenderer:
    public: true
    shared: false

  WapplerSystems\MapMagic\Domain\Runtime\FormRuntime:
    public: true
    shared: false

  WapplerSystems\MapMagic\Mvc\ProcessingRule:
    public: true
    shared: false

  WapplerSystems\MapMagic\Mvc\Property\PropertyMappingConfiguration:
    public: true

  WapplerSystems\MapMagic\Slot\ResourcePublicationSlot:
    tags:
      - name: event.listener
        identifier: 'mapmagic/resource-getPublicUrl'
        method: 'getPublicUrl'

  WapplerSystems\MapMagic\Slot\FilePersistenceSlot:
    tags:
      - name: event.listener
        identifier: 'mapmagic/creation'
        method: 'onPreFileCreate'
      - name: event.listener
        identifier: 'mapmagic/add'
        method: 'onPreFileAdd'
      - name: event.listener
        identifier: 'mapmagic/rename'
        method: 'onPreFileRename'
      - name: event.listener
        identifier: 'mapmagic/replace'
        method: 'onPreFileReplace'
      - name: event.listener
        identifier: 'mapmagic/move'
        method: 'onPreFileMove'
      - name: event.listener
        identifier: 'mapmagic/update-content'
        method: 'onPreFileSetContents'

  WapplerSystems\MapMagic\EventListener\ProcessFileListActionsEventListener:
    tags:
      - name: event.listener
        identifier: 'mapmagic/form-definition-files'

  WapplerSystems\MapMagic\EventListener\DataStructureIdentifierListener:
    tags:
      - name: event.listener
        identifier: 'mapmagic/modify-data-structure-identifier'
        method: 'modifyDataStructureIdentifier'
      - name: event.listener
        identifier: 'mapmagic/modify-data-structure'
        method: 'modifyDataStructure'

  WapplerSystems\MapMagic\SoftReference\FormPersistenceIdentifierSoftReferenceParser:
    tags:
      - name: softreference.parser
        parserKey: formPersistenceIdentifier

  WapplerSystems\MapMagic\Mvc\Property\TypeConverter\FormDefinitionArrayConverter:
    tags:
      - name: extbase.type_converter
        priority: 10
        target: WapplerSystems\MapMagic\Type\FormDefinitionArray
        sources: string
