imports:
  - { resource: './DataSources/DefaultOSM.yaml' }
  - { resource: './DataSourceTypes/AddressDataSource.yaml' }
  - { resource: './DataSourceTypes/GeoJSONDataSource.yaml' }
  - { resource: './DataSourceTypes/OSMDataSource.yaml' }
  - { resource: './MapElements/AddressDataLayer.yaml' }
  - { resource: './MapElements/CircleLayer.yaml' }
  - { resource: './MapElements/Map.yaml' }
  - { resource: './MapElements/MarkerLayer.yaml' }
  - { resource: './MapElements/OSMLayer.yaml' }
  - { resource: './MapElements/PolygonLayer.yaml' }


persistenceManager:
  allowedFileMounts:
    10: '1:/map_definitions/'
  # Read-only demo maps shipped with the extension (save/delete stay disabled below).
  allowedExtensionPaths:
    10: 'EXT:map_magic/Resources/Private/Maps/'
  allowSaveToExtensionPaths: false
  allowDeleteFromExtensionPaths: false
  sortByKeys:
    - name
    - fileUid
  sortAscending: true

prototypes:
  standard:
    mapEditor:
      translationFiles:
        10: 'EXT:map_magic/Resources/Private/Language/Database.xlf'
      dynamicJavaScriptModules:
        app: '@wapplersystems/mapmagic/backend/form-editor.js'
        mediator: '@wapplersystems/mapmagic/backend/form-editor/mediator.js'
        viewModel: '@wapplersystems/mapmagic/backend/form-editor/view-model.js'
      addInlineSettings: {  }
      maximumUndoSteps: 10
      stylesheets:
        200: 'EXT:map_magic/Resources/Public/Css/maps.css'
      MapEditorFluidConfiguration:
        templatePathAndFilename: 'EXT:map_magic/Resources/Private/Backend/Templates/MapEditor/InlineTemplates.html'
        partialRootPaths:
          10: 'EXT:map_magic/Resources/Private/Backend/Partials/MapEditor/'
        layoutRootPaths:
          10: 'EXT:map_magic/Resources/Private/Backend/Layouts/MapEditor/'

      mapEditorPartials:
        MapElement-_ElementToolbar: Stage/_ElementToolbar
        MapElement-_UnknownElement: Stage/_UnknownElement
        Modal-InsertElements: Modals/InsertElements
        Modal-InsertPages: Modals/InsertPages
        Modal-ValidationErrors: Modals/ValidationErrors
        Inspector-MapElementHeaderEditor: Inspector/MapElementHeaderEditor
        Inspector-CollectionElementHeaderEditor: Inspector/CollectionElementHeaderEditor
        Inspector-TextEditor: Inspector/TextEditor
        Inspector-PropertyGridEditor: Inspector/PropertyGridEditor
        Inspector-SingleSelectEditor: Inspector/SingleSelectEditor
        Inspector-MultiSelectEditor: Inspector/MultiSelectEditor
        Inspector-GridColumnViewPortConfigurationEditor: Inspector/GridColumnViewPortConfigurationEditor
        Inspector-TextareaEditor: Inspector/TextareaEditor
        Inspector-RemoveElementEditor: Inspector/RemoveElementEditor
        Inspector-FinishersEditor: Inspector/FinishersEditor
        Inspector-ValidatorsEditor: Inspector/ValidatorsEditor
        Inspector-RequiredValidatorEditor: Inspector/RequiredValidatorEditor
        Inspector-CheckboxEditor: Inspector/CheckboxEditor
        Inspector-ValidationErrorMessageEditor: Inspector/ValidationErrorMessageEditor
        Inspector-Typo3WinBrowserEditor: Inspector/Typo3WinBrowserEditor

      mapElementPropertyValidatorsDefinition:
        NotEmpty:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.NotEmpty.label
        Integer:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.Integer.label
        NaiveEmail:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.NaiveEmail.label
        NaiveEmailOrEmpty:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.NaiveEmail.label
        MapElementIdentifierWithinCurlyBracesInclusive:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.MapElementIdentifierWithinCurlyBraces.label
        MapElementIdentifierWithinCurlyBracesExclusive:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.MapElementIdentifierWithinCurlyBraces.label
        FileSize:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.FileSize.label
        RFC3339FullDate:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.RFC3339FullDate.label
        RegularExpressionPattern:
          errorMessage: mapEditor.mapElementPropertyValidatorsDefinition.RegularExpressionPattern.label

      mapElementGroups:
        input:
          label: mapEditor.mapElementGroups.input.label
        html5:
          label: mapEditor.mapElementGroups.html5.label
        select:
          label: mapEditor.mapElementGroups.select.label
        custom:
          label: mapEditor.mapElementGroups.custom.label
        container:
          label: mapEditor.mapElementGroups.container.label
        page:
          label: mapEditor.mapElementGroups.page.label

    mapEngine:
      translationFiles:
        10: 'EXT:map_magic/Resources/Private/Language/Database.xlf'

mapManager:
  dynamicJavaScriptModules:
    app: '@wapplersystems/mapmagic/backend/form-manager.js'
    viewModel: '@wapplersystems/mapmagic/backend/form-manager/view-model.js'
  stylesheets:
    100: 'EXT:map_magic/Resources/Public/Css/form.css'
  translationFiles:
    10: 'EXT:map_magic/Resources/Private/Language/Database.xlf'
  javaScriptTranslationFile: 'EXT:map_magic/Resources/Private/Language/locallang_mapManager_javascript.xlf'
  selectablePrototypesConfiguration:
    100:
      identifier: standard
      label: mapManager.selectablePrototypesConfiguration.standard.label
      newMapTemplates:
        100:
          templatePath: 'EXT:map_magic/Resources/Private/Backend/Templates/MapEditor/Yaml/NewMaps/BlankMap.yaml'
          label: mapManager.selectablePrototypesConfiguration.standard.newMapTemplates.blankMap.label
        200:
          templatePath: 'EXT:map_magic/Resources/Private/Backend/Templates/MapEditor/Yaml/NewMaps/SimpleContactMap.yaml'
          label: mapManager.selectablePrototypesConfiguration.standard.newMapTemplates.simpleContactMap.label
  controller:
    deleteAction:
      errorTitle: mapManagerController.deleteAction.error.title
      errorMessage: mapManagerController.deleteAction.error.body
