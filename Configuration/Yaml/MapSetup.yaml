# Where map definition files (*.map.yaml) live. Override or extend in a site
# package via plugin.tx_mapmagic.settings.yamlConfigurations / module.tx_mapmagic.
persistenceManager:
  allowedFileMounts:
    10: '1:/map_definitions/'
  # Read-only demo maps shipped with the extension (save/delete stay disabled below).
  allowedExtensionPaths:
    10: 'EXT:map_magic/Resources/Private/Maps/'
  allowSaveToExtensionPaths: false
  allowDeleteFromExtensionPaths: false
  sortByKeys:
    - name
    - fileUid
  sortAscending: true
